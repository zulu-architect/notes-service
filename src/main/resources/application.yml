spring:
  application:
    name: notes-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # optional: the service still starts if the Config Server is down (tightened later)
    # vault:// is NOT optional: if Vault is down or the token is bad, startup fails (fail-fast)
    import:
      - "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
      - "vault://"
  cloud:
    vault:
      scheme: http
      host: ${VAULT_HOST:localhost}
      port: 8200
      fail-fast: true
      # Dev-mode root token: acceptable for proving the pattern, never for production
      authentication: TOKEN
      token: ${VAULT_TOKEN:dev-root-token}
      kv:
        enabled: true
        backend: secret
        # default-context is the app name, so this reads secret/notes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notes}
    # db.username / db.password come from Vault (secret/notes-service); no defaults on purpose
    username: ${db.username}
    password: ${db.password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true
