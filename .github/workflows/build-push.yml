name: build-push

on:
  push:
    branches: [main]
    # Only rebuild when something that ends up in the image changes
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

# A newer push supersedes an in-flight build of the same branch
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: notes-service
  # Not a secret: an ARN is only a name. Trust is enforced by the role's trust policy (repo + branch).
  AWS_ROLE_ARN: arn:aws:iam::422653420415:role/notes-service-github-ci

permissions:
  id-token: write # lets the job request the OIDC token AWS verifies
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest # amd64: matches the k3s host, so no emulation
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      # ECR tags are IMMUTABLE: re-running a build for the same commit must not try to overwrite
      - name: Check whether the tag already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found == 'false'

      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # no provenance/SBOM attestations: avoids untagged extra manifests in ECR
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs even when the image already existed: the bump is idempotent (no diff -> no commit)
      - name: Check out the GitOps repo
        uses: actions/checkout@v4
        with:
          repository: zulu-architect/notes-service-gitops
          # Fine-grained PAT: Contents read/write on this one repo only. GITHUB_TOKEN cannot write cross-repo.
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Bump image.tag in the GitOps repo
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cd gitops
          FILE=chart/notes-service/values.yaml
          # Only the two-space-indented `tag:` under `image:` (postgres has none)
          sed -i -E "s|^(  tag: ).*|\1\"${TAG}\"|" "$FILE"
          grep -qE "^  tag: \"${TAG}\"$" "$FILE" || { echo "tag line not updated"; exit 1; }
          if git diff --quiet; then
            echo "values.yaml already at ${TAG}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: deploy notes-service ${TAG}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` (already existed: ${{ steps.exists.outputs.found }})" >> "$GITHUB_STEP_SUMMARY"
